<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPS · Vận hành nền tảng</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182230;background:#f5f7fb;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 52% 0%,#e8f1ec 0%,#f5f7fb 55%)}
    .card{width:min(100%,560px);padding:32px;background:#fff;border:1px solid #e4eaf0;border-radius:18px;box-shadow:0 18px 55px #1e34400e}.brand{font-size:13px;font-weight:750;color:#194b3d;letter-spacing:.04em}.eyebrow{margin:24px 0 7px;font-size:11px;color:#788594;font-weight:650;letter-spacing:.06em;text-transform:uppercase}h1{margin:0;font-size:24px;letter-spacing:-.035em}p{color:#728090;font-size:13px;line-height:1.6}
    label{display:block;margin:15px 0 7px;font-size:12px;color:#526171;font-weight:620}input{width:100%;height:43px;padding:0 12px;border:1px solid #dfe6eb;border-radius:9px;color:#263644;font-size:13px;outline:none}input:focus{border-color:#84aa98;box-shadow:0 0 0 3px #194b3d10}button{height:43px;padding:0 16px;margin-top:21px;border:0;border-radius:9px;background:#194b3d;color:#fff;font-size:13px;font-weight:650;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:20px;margin-top:12px;color:#b7443d;font-size:12px;line-height:1.5}.success{display:none;margin-top:18px;padding:15px;border:1px solid #d9eadf;border-radius:10px;background:#f3faf5;color:#355a46;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.success button{height:32px;margin:8px 0 0;padding:0 10px;font-size:11px}.back{display:block;margin-top:18px;color:#60706b;font-size:12px;text-align:center;text-decoration:none}.back:hover{color:#194b3d}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">MPS · VẬN HÀNH NỀN TẢNG</div>
    <div class="eyebrow">Cấp tenant</div>
    <h1>Thêm trường mới</h1>
    <p>Tạo tenant và lời mời Quản sinh đầu tiên. Khóa vận hành chỉ gửi trong header API và không được lưu trên trình duyệt.</p>
    <form id="school-form">
      <label for="school-code">Mã trường</label>
      <input id="school-code" required minlength="3" maxlength="32" pattern="[A-Za-z0-9-]+" placeholder="Ví dụ: ABC-COLLEGE">
      <label for="school-name">Tên trường</label>
      <input id="school-name" required minlength="2" maxlength="150" placeholder="Tên hiển thị của trường">
      <label for="platform-key">Khóa vận hành nền tảng</label>
      <input id="platform-key" type="password" required autocomplete="off" placeholder="MPS_PLATFORM_PROVISIONING_KEY">
      <button id="create-button" type="submit">Tạo trường và lời mời Quản sinh</button>
    </form>
    <button id="load-schools" type="button">Tải danh sách trường</button>
    <div id="school-list" style="margin-top:14px"></div>
    <div id="message" class="error" role="alert"></div>
    <div id="success" class="success"></div>
    <a class="back" href="/">← Quay lại đăng nhập</a>
  </main>
  <script>
    const API_BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:5127' : window.location.origin;
    const form = document.querySelector('#school-form');
    const button = document.querySelector('#create-button');
    const message = document.querySelector('#message');
    const success = document.querySelector('#success');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = '';
      success.style.display = 'none';
      button.disabled = true;
      try {
        const response = await fetch(`${API_BASE_URL}/api/v1/platform/schools`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-MPS-Platform-Key': document.querySelector('#platform-key').value },
          body: JSON.stringify({ code: document.querySelector('#school-code').value.trim(), name: document.querySelector('#school-name').value.trim() })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.message || data.title || `Không tạo được trường (HTTP ${response.status}).`);
        const base = window.location.protocol === 'file:' ? API_BASE_URL : window.location.origin;
        const inviteUrl = `${base}/#invite=${encodeURIComponent(data.managerInviteToken)}`;
        success.innerHTML = `<strong>Đã tạo ${escapeHtml(data.name)} (${escapeHtml(data.code)}).</strong><br>Lời mời Quản sinh hết hạn: ${new Date(data.inviteExpiresAtUtc).toLocaleString('vi-VN')}<br><a href="${inviteUrl}">${inviteUrl}</a><br><button id="copy-invite" type="button">Sao chép lời mời</button>`;
        success.style.display = 'block';
        document.querySelector('#copy-invite').addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(inviteUrl); }
          catch { window.prompt('Sao chép link lời mời:', inviteUrl); }
        });
        await loadSchools();
      } catch (error) {
        message.textContent = error instanceof TypeError ? 'Không kết nối được API.' : error.message;
      } finally { button.disabled = false; }
    });
    document.querySelector('#load-schools').addEventListener('click', loadSchools);
    async function loadSchools() {
      const key = document.querySelector('#platform-key').value;
      const list = document.querySelector('#school-list');
      list.textContent = 'Đang tải…';
      message.textContent = '';
      try {
        const response = await fetch(`${API_BASE_URL}/api/v1/platform/schools`, { headers: { 'X-MPS-Platform-Key': key } });
        const schools = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(schools.detail || schools.title || `Không tải được danh sách trường (HTTP ${response.status}).`);
        list.replaceChildren();
        const table = document.createElement('table');
        table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px;text-align:left';
        const head = document.createElement('tr');
        for (const label of ['Mã trường','Tên trường','Trạng thái','']) { const cell=document.createElement('th'); cell.textContent=label; cell.style.cssText='padding:9px 6px;border-bottom:1px solid #e8edf2;color:#788594'; head.append(cell); }
        const thead=document.createElement('thead'); thead.append(head); table.append(thead);
        const tbody=document.createElement('tbody');
        for (const school of schools) {
          const row=document.createElement('tr');
          for (const value of [school.code,school.name,school.isActive?'Hoạt động':'Đã tạm ngưng']) { const cell=document.createElement('td'); cell.textContent=value; cell.style.cssText='padding:10px 6px;border-bottom:1px solid #eef1f4'; row.append(cell); }
          const actionCell=document.createElement('td'); actionCell.style.cssText='padding:8px 6px;border-bottom:1px solid #eef1f4';
          const action=document.createElement('button'); action.type='button'; action.textContent=school.isActive?'Tạm ngưng':'Kích hoạt'; action.style.cssText='height:30px;margin:0;padding:0 9px;font-size:11px';
          action.addEventListener('click',()=>setSchoolActive(school.schoolId,!school.isActive)); actionCell.append(action); row.append(actionCell); tbody.append(row);
        }
        table.append(tbody); list.append(table);
      } catch (error) {
        list.replaceChildren(); message.textContent=error instanceof TypeError?'Không kết nối được API.':error.message;
      }
    }
    async function setSchoolActive(id,isActive) {
      const key=document.querySelector('#platform-key').value;
      try {
        const response=await fetch(`${API_BASE_URL}/api/v1/platform/schools/${id}/active`,{
          method:'PUT',headers:{'Content-Type':'application/json','X-MPS-Platform-Key':key},body:JSON.stringify({isActive})
        });
        if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.detail||data.title||`Không cập nhật được trường (HTTP ${response.status}).`)}
        await loadSchools();
      } catch(error) { message.textContent=error instanceof TypeError?'Không kết nối được API.':error.message; }
    }
    function escapeHtml(value) { const span = document.createElement('span'); span.textContent = value || ''; return span.innerHTML; }
  </script>
</body>
</html>
